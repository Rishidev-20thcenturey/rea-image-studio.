name: Android

# REA Image Studio: host tests, the arm64 native library, and the installable APK.
#
# There is no Android toolchain in the development container this repository is edited in, so CI is
# the only build path. The APK this workflow uploads is the artifact the project ships.
#
# Actions are pinned to commit SHAs so a moving tag cannot change what runs.

on:
  push:
    branches:
      - main
      - 'arena/**'
    # The from-scratch app lives in studio/ and has its own workflow (studio.yml); a change there
    # cannot break this build, so it does not pay for it. docs/ holds generated evidence commits.
    paths-ignore:
      - 'studio/**'
      - 'docs/**'
      - '.github/workflows/studio.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

jobs:
  # Host-side tests. These run natively (no NDK) and catch a broken Rust edit in minutes instead of
  # the hour the cross-compiled APK job takes. They run in parallel with the APK, so a test failure
  # never delays the artifact.
  tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: host-tests
      - name: Test the Android shell's protocol, saving and crash recovery
        run: cargo test -p photocraft-android
      - name: Test the rebranded links, start page and About dialog
        # Quoted: a plain YAML scalar cannot hold the ':: ' in the test filters.
        run: 'cargo test -p photocraft-ui-egui --lib -- links:: dialogs::start_page'
      - name: Test the diagnostic log
        run: 'cargo test -p photocraft-doc --lib diag::'

  # The APK. arm64-v8a only, which is what the Rust library is built for and what every current
  # Android tablet uses.
  apk:
    name: Build the arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      # Publishing the inspection report back to the branch (see the last steps).
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android SDK packages
        shell: bash
        run: |
          set -eo pipefail
          SDK="$HOME/android-sdk"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" "$CMDLINE_TOOLS_URL"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
            mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > "$RUNNER_TEMP/licenses.log" 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-arm64
          # Keep the compiled dependencies even when a build fails, so a rerun starts from them.
          cache-on-failure: true

      - name: Point Cargo at the NDK's clang
        shell: bash
        run: |
          set -eo pipefail
          BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "$BIN/aarch64-linux-android29-clang" ]; then
            echo "::error title=NDK missing::no clang at $BIN"
            ls "$ANDROID_HOME/ndk" || true
            exit 1
          fi
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android29-clang"
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android29-clang"
            echo "CXX_aarch64_linux_android=$BIN/aarch64-linux-android29-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build libphotocraft_android.so
        shell: bash
        run: |
          set -eo pipefail
          cargo build -p photocraft-android --lib --target aarch64-linux-android \
            --profile android --keep-going --message-format=short

      # The cdylib carries its own symbols; without this the APK is ~96 MiB. llvm-strip keeps the
      # dynamic symbols the loader needs (android_main, ANativeActivity_onCreate, JNI entry points).
      - name: Strip the library
        shell: bash
        run: |
          set -eo pipefail
          BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO=target/aarch64-linux-android/android/libphotocraft_android.so
          before=$(stat -c%s "$SO")
          "$BIN/llvm-strip" --strip-unneeded "$SO"
          after=$(stat -c%s "$SO")
          echo "library: $((before / 1024 / 1024)) MiB -> $((after / 1024 / 1024)) MiB"

      - name: Put the library in the APK
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/android/libphotocraft_android.so \
             android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'

      # The version tags carry into the APK. Without this every build was versionCode 1, so Play
      # would reject the second upload and an update could not be told from the build it replaces.
      # A tag `v1.2.3` becomes versionName 1.2.3 and versionCode 10203; a branch build stays 1.0.0.
      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            IFS=. read -r major minor patch <<< "$ver"
            code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          else
            ver="1.0.0"
            code=1
          fi
          echo "name=$ver" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "building $ver (versionCode $code)"

      # No release keystore is configured yet, so this is a debug-signed APK with our applicationId.
      # That is installable and honest; a release key is a follow-up (see README, "Signing").
      - name: Build the APK
        id: build_apk
        shell: bash
        run: |
          set -eo pipefail
          gradle -p android :app:assembleDebug --no-daemon \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          DEST=android/app/build/outputs/apk/REAImageStudio-debug.apk
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      # Static evidence, no device needed. Every check writes to a report that is uploaded as an
      # artifact, so the evidence can be read without access to the job log. Required facts fail the
      # job; descriptive output only informs it.
      - name: Inspect the APK (static evidence, no device needed)
        env:
          APK: ${{ steps.build_apk.outputs.apk_path }}
        shell: bash
        run: |
          set -uo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          READELF="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          REPORT="$RUNNER_TEMP/inspection-report.txt"
          : > "$REPORT"
          note() { echo "$*" | tee -a "$REPORT"; }
          fail=0
          bad() { echo "::error title=APK check failed::$*" | tee -a "$REPORT"; fail=1; }

          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1 || true
          note "== badging =="
          grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code|launchable-activity):" \
            "$RUNNER_TEMP/badging.txt" | tee -a "$REPORT" || true

          grep -q "package: name='com.rea.imagestudio'" "$RUNNER_TEMP/badging.txt" \
            || bad "applicationId is not com.rea.imagestudio"
          grep -q "launchable-activity: name='com.rea.imagestudio.MainActivity'" "$RUNNER_TEMP/badging.txt" \
            || bad "the launcher activity is not com.rea.imagestudio.MainActivity"
          grep -q "application-label:'REA Image Studio'" "$RUNNER_TEMP/badging.txt" \
            || bad "the application label is not REA Image Studio"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt" \
            || bad "the APK does not declare arm64-v8a"

          note ""
          note "== archive =="
          unzip -l "$APK" | grep -E "lib/|classes.*\.dex|resources\.arsc|AndroidManifest\.xml" | tee -a "$REPORT" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libphotocraft_android.so" \
            || bad "the native library is not packaged for arm64-v8a"

          note ""
          note "== native exports =="
          mkdir -p "$RUNNER_TEMP/apkx"
          unzip -o -q "$APK" "lib/arm64-v8a/libphotocraft_android.so" -d "$RUNNER_TEMP/apkx" || true
          SO="$RUNNER_TEMP/apkx/lib/arm64-v8a/libphotocraft_android.so"
          if [ -f "$SO" ]; then
            "$READELF" --dyn-syms "$SO" > "$RUNNER_TEMP/syms.txt" 2>&1 || true
            grep -E "android_main$|ANativeActivity_onCreate$" "$RUNNER_TEMP/syms.txt" | tee -a "$REPORT" || true
            grep -qE "android_main$" "$RUNNER_TEMP/syms.txt" || bad "the library does not export android_main"
            grep -qE "ANativeActivity_onCreate$" "$RUNNER_TEMP/syms.txt" || bad "the library does not export ANativeActivity_onCreate"
            note "library size: $(( $(stat -c%s "$SO") / 1024 / 1024 )) MiB"
          fi

          note ""
          note "== dex =="
          unzip -l "$APK" | grep -E "\.dex$" | tee -a "$REPORT" || true
          DEXDUMP="$ANDROID_HOME/build-tools/35.0.0/dexdump"
          for dex in classes.dex classes2.dex classes3.dex; do
            if unzip -p "$APK" "$dex" > "$RUNNER_TEMP/$dex" 2>/dev/null && [ -s "$RUNNER_TEMP/$dex" ]; then
              note "$dex: $(stat -c%s "$RUNNER_TEMP/$dex") bytes"
              if [ -x "$DEXDUMP" ]; then
                "$DEXDUMP" -f "$RUNNER_TEMP/$dex" > "$RUNNER_TEMP/$dex.dump" 2>&1 || true
                note "class descriptors in $dex:"
                grep -E "Class descriptor" "$RUNNER_TEMP/$dex.dump" | head -20 | tee -a "$REPORT" || true
              fi
              # dexdump is authoritative; the raw string scan is the fallback when it is absent.
              if grep -aq "Lcom/rea/imagestudio/MainActivity;" "$RUNNER_TEMP/$dex"; then
                note "found com/rea/imagestudio/MainActivity in $dex"
                found_activity=1
              fi
              if grep -aq "photocraftCall" "$RUNNER_TEMP/$dex"; then
                note "found photocraftCall in $dex"
                found_call=1
              fi
            fi
          done
          [ "${found_activity:-0}" = "1" ] || bad "MainActivity is not in any dex file of the APK"
          [ "${found_call:-0}" = "1" ] || bad "the photocraftCall JNI method is not in any dex file of the APK"

          note ""
          note "APK size: $(( $(stat -c%s "$APK") / 1024 / 1024 )) MiB"
          note "APK sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
          cp "$REPORT" "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Publish the inspection report into the repository
        # main only: two branches writing the same generated file conflict on merge.
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs/ci
          {
            echo "<!-- Written by .github/workflows/android.yml. Do not edit by hand. -->"
            echo "# Last build evidence"
            echo ""
            echo "Commit \`$GITHUB_SHA\`, run [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/inspection-report.txt" 2>/dev/null || echo "(no report: the build failed before inspection)"
            echo '```'
          } > docs/ci/last-build.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="$GITHUB_REF_NAME"
          case "$GITHUB_REF" in refs/tags/*) BRANCH=main;; esac
          # Commit on the branch tip so the push is a fast-forward, even on a tag-triggered run.
          git fetch -q origin "$BRANCH"
          git reset -q --soft "origin/$BRANCH"
          git add docs/ci/last-build.md
          if git diff --quiet --cached; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -q -m "Record the build evidence for $GITHUB_SHA [skip ci]"
          git push origin "HEAD:$BRANCH" || echo "::warning title=report::could not push the report"

      - name: Upload the inspection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspection-report
          path: ${{ runner.temp }}/inspection-report.txt
          if-no-files-found: warn

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: REAImageStudio-apk
          path: ${{ steps.build_apk.outputs.apk_path }}
          if-no-files-found: error

  # A tag of the form v1.2.3 publishes the APK as a downloadable release asset.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: REAImageStudio-apk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eo pipefail
          gh release create "$TAG" dist/REAImageStudio-debug.apk \
            --title "REA Image Studio $TAG" \
            --notes "Debug-signed arm64 APK, built by GitHub Actions from $GITHUB_SHA. See README \"Status\" for what is verified and what is not."
