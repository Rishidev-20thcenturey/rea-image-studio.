name: Studio core

# The original editing core in studio/core. This is the fast feedback loop: no Android SDK, no
# Gradle, just the crate's own test suite plus a cross-compile of the JNI bridge for the device
# ABI. It runs on every push that touches the core.

on:
  push:
    paths:
      - 'studio/core/**'
      - '.github/workflows/studio-core.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: studio-core-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

jobs:
  test:
    name: Core unit tests (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: studio/core
          key: studio-core-host
      - name: Run the tests
        shell: bash
        run: |
          set -uo pipefail
          cd studio/core
          cargo test --release 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          {
            echo "## REA core tests"
            echo ""
            echo '```'
            grep -E "^(test |running |failures:|error)" "$RUNNER_TEMP/test.log" | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The job log is not reachable from where this repository is developed, so the compiler's
      # output is republished as one annotation with its newlines intact (%0A).
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/test.log"
          [ -f "$LOG" ] || { echo "no log at $LOG"; exit 0; }
          {
            echo "--- errors and locations ---"
            grep -n -E "^(error|warning: unused| *-->)" "$LOG" | head -30 || true
            echo "--- failures ---"
            grep -n -A4 -E "^(failures:|test .* FAILED)" "$LOG" | head -40 || true
            echo "--- tail ---"
            tail -n 30 "$LOG"
          } > "$RUNNER_TEMP/report.txt"
          enc=$(tr '\n' '~' < "$RUNNER_TEMP/report.txt" | sed 's/~/%0A/g; s/%/%25/g')
          echo "::error title=Core tests::$enc"

  android:
    name: Cross-compile for arm64 (JNI bridge)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK
        shell: bash
        run: |
          set -eo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/ct.zip" "$CMDLINE_TOOLS_URL"
          unzip -q "$RUNNER_TEMP/ct.zip" -d "$RUNNER_TEMP/ct"
          mv "$RUNNER_TEMP/ct/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: studio/core
          key: studio-core-android
          cache-on-failure: true
      - name: Build the arm64 library
        shell: bash
        run: |
          set -eo pipefail
          BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cd studio/core
          set +e
          cargo build --release --target aarch64-linux-android 2>&1 | tee "$RUNNER_TEMP/build.log"
          st=${PIPESTATUS[0]}
          set -e
          if [ "$st" -ne 0 ]; then
            exit "$st"
          fi
          SO=target/aarch64-linux-android/release/librea_core.so
          ls -l "$SO"
          count=$("$BIN/llvm-readelf" --dyn-syms "$SO" | grep -c "Java_com_rea_studio_NativeCore" || true)
          echo "JNI symbols exported: $count"
          if [ "$count" -lt 40 ]; then
            echo "::error title=JNI surface::only $count JNI symbols exported, expected the whole bridge"
            exit 1
          fi

      # Same republishing, for the arm64 build.
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "no log at $LOG"; exit 0; }
          {
            echo "--- errors and locations ---"
            grep -n -E "^(error|warning: unused| *-->)" "$LOG" | head -40 || true
            echo "--- tail ---"
            tail -n 40 "$LOG"
          } > "$RUNNER_TEMP/report.txt"
          enc=$(tr '\n' '~' < "$RUNNER_TEMP/report.txt" | sed 's/~/%0A/g; s/%/%25/g; s/%25%0A/%0A/g')
          echo "::error title=arm64 build::$enc"
