plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rea.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rea.studio'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // The Rust core is built for the shipped ABI; the emulator build passes -PreaAbis=x86_64.
        ndk {
            abiFilters(*(project.findProperty('reaAbis') ?: 'arm64-v8a').toString().split(','))
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

kotlin {
    jvmToolchain(17)
}
